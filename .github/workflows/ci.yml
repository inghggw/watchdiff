name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No dependencies to install: the test suite runs on a bare checkout.
      # `npm test` runs a bare `node --test`: the runner discovers test/ itself.
      # A "test/*.test.js" argument would break on Node 20, which does not expand
      # the pattern, and on Windows, where the shell does not expand it either.
      - run: npm test
